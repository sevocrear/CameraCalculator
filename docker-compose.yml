services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "8088:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  test:
    build:
      context: .
      target: test
    network_mode: "service:app"
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://127.0.0.1:8000
    command: ["pytest", "-v", "--tb=short"]
    profiles:
      - test
