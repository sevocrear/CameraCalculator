<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CameraCalculator</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/three.min.js"></script>
  <script src="/static/js/OrbitControls.js"></script>
  <script src="/static/js/GLTFLoader.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>CameraCalculator</h1>
      <p class="subtitle">Подбор камеры: FOV, PPM, пиксели на объекте</p>
    </header>

    <section class="controls">
      <div class="row">
        <label data-help="cameraPreset">Пресет камеры
          <select id="cameraPreset"></select>
        </label>
        <label data-help="lensType">Тип оптики
          <select id="lensType">
            <option value="rectilinear">Rectilinear</option>
            <option value="fisheye_equidistant">Fisheye equidistant</option>
          </select>
        </label>
        <label data-help="fisheyeFov">Fisheye FOV (°)
          <input type="number" id="fisheyeFov" min="15" max="220" step="1" value="160">
        </label>
      </div>
      <div class="row">
        <label data-help="sensorFormat">Размер матрицы
          <select id="sensorFormat"></select>
        </label>
        <span id="sensorDimsMm" class="sensor-dims-mm" data-help="sensorDimsMm">—</span>
        <label data-help="resW">Resolution W <input type="number" id="resW" step="1" value="1920"></label>
        <label data-help="resH">Resolution H <input type="number" id="resH" step="1" value="1080"></label>
        <label data-help="focal">Focal (mm) <input type="number" id="focal" step="0.1" value="2.8"></label>
      </div>
      <div class="row">
        <label data-help="distance">Расстояние до плоскости (м)
          <input type="range" id="distance" min="0.1" max="30" step="0.05" value="1.0">
          <span id="distanceVal">1.0</span> м
        </label>
        <label data-help="mountHeight">Высота установки (м)
          <input type="number" id="mountHeight" step="0.1" min="0" max="6" value="2.5">
        </label>
      </div>
      <div class="row objects">
        <span>Объект:</span>
        <div id="objectTabs" class="tabs"></div>
        <label data-help="objectDistance">Расстояние до объекта (м)
          <input type="range" id="objectDistance" min="0.1" max="30" step="0.05" value="1.0">
          <span id="objectDistanceVal">1.0</span> м
        </label>
      </div>
      <p class="disclaimer" id="fisheyeDisclaimer" hidden>
        Fisheye: расчёт пикселей на оси кадра. На краях картинки плотность ниже.
      </p>
    </section>

    <main class="layout">
      <div class="panel viz3d">
        <h2>3D — frustum, объект, DORI</h2>
        <div id="viewport3d"></div>
      </div>
      <div class="panel metrics">
        <h2>Метрики</h2>
        <dl>
          <dt data-help="metricHfov">HFOV</dt><dd id="metricHfov">—</dd>
          <dt data-help="metricVfov">VFOV</dt><dd id="metricVfov">—</dd>
          <dt data-help="metricDfov">DFOV</dt><dd id="metricDfov">—</dd>
          <dt data-help="metricCoverage">Coverage @ Z</dt><dd id="metricCoverage">—</dd>
          <dt data-help="metricPpm">PPM</dt><dd id="metricPpm">—</dd>
          <dt data-help="metricPpc">PPC</dt><dd id="metricPpc">—</dd>
          <dt data-help="metricGsd">GSD</dt><dd id="metricGsd">—</dd>
        </dl>
        <h3>Объект</h3>
        <p id="metricObjectPx" class="object-px" data-help="metricObjectPx">—</p>
        <p id="metricCvPass" class="cv-pass" data-help="metricCvPass">—</p>
        <h3>DORI (м)</h3>
        <ul id="doriList" class="dori"></ul>
      </div>
      <div class="panel viz2d">
        <h2 id="viewport2dTitle">2D — вид камеры</h2>
        <div class="canvas-wrap">
          <canvas id="viewport2d"></canvas>
        </div>
      </div>
    </main>
  </div>

        <script src="/static/js/model_prep.js?v=20260714a"></script>
        <script src="/static/js/help.js?v=20260714a"></script>
        <script src="/static/js/viewport2d.js?v=20260714a"></script>
        <script src="/static/js/scene3d.js?v=20260714a"></script>
        <script src="/static/js/app.js?v=20260714a"></script>
</body>
</html>
